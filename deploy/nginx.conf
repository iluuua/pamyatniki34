# Production configuration for pamyatniki34.ru.
server {
    listen 80;
    server_name pamyatniki34.ru www.pamyatniki34.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://pamyatniki34.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pamyatniki34.ru;
    root /var/www/pamyatniki34/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pamyatniki34.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pamyatniki34.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:webp|jpg|jpeg|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name www.pamyatniki34.ru;

    ssl_certificate /etc/letsencrypt/live/pamyatniki34.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pamyatniki34.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pamyatniki34.ru$request_uri;
}
