# Bootstrap configuration for HTTP validation and Let's Encrypt webroot.
server {
    listen 80;
    server_name pamyatniki34.ru www.pamyatniki34.ru;
    root /var/www/pamyatniki34/current;
    index index.html;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:webp|jpg|jpeg|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
